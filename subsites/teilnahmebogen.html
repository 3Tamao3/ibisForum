<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ibis acam - Teilnahmebogen</title>
  <link rel="stylesheet" href="../style.css" />
  <link rel="icon" type="image/png" href="../imgs/images.png" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css" />
</head>

<body>
  <div class="centerBox">
    <div class="topRow">
      <img src="../imgs/images.png" alt="ibis acam Logo" />
      <div class="spracheButtons">
        <button class="btn-liquid liquid" type="button" id="btnDE">DE</button>
        <button class="btn-liquid liquid" type="button" id="btnEN">EN</button>
      </div>
    </div>
    <h1 data-i18n="checkin_title">Teilnahmebogen/Check-In</h1>
    <form action="../connect.php" method="post" enctype="multipart/form-data">
      <div>
        <label data-i18n="admin_note"> </label>
      </div>
      <br />
      <div>
        <label for="lehrform" data-i18n="choose_lehrform"> </label>
        <br />
        <select name="lehrform" id="lehrform">
          <option value="ÜBN1">ÜBN1</option>
          <option value="ÜBN2">ÜBN2</option>
          <option value="ÜBV">ÜBV</option>
          <option value="TQU2">TQU2</option>
        </select>
      </div>
      <br />
      <div>
        <label for="lehrberuf" data-i18n="choose_lehrberuf"> </label>
        <br />
        <select name="lehrberuf">
          <option value="applikationsentwickler - coding" data-i18n="job_appdev">
            Applikationsentwickler - Coding
          </option>
          <option value="buerokaufleute" data-i18n="job_office">
            Bürokaufleute
          </option>
          <option value="drogisten" data-i18n="job_drugstore">
            Drogisten
          </option>
          <option value="einzelhandel" data-i18n="job_retail">
            Einzelhandel
          </option>
          <option value="betriebslogistik" data-i18n="job_logistics">
            Betriebslogistik
          </option>
          <option value="immobilienkaufleute" data-i18n="job_realestate">
            Immobilienkaufleute
          </option>
          <option value="informationstechnologie - betriebstechnik" data-i18n="job_it_ops">
            Informationstechnologie - Betriebstechnik
          </option>
          <option value="speitinskaufleute" data-i18n="job_forwarding">
            Speditionskaufleute
          </option>
          <option value="kosmetik" data-i18n="job_cosmetics">Kosmetik</option>
          <option value="pka" data-i18n="job_pka">PKA</option>
        </select>
      </div>
      <br />
      <div>
        <p data-i18n="vorlehrzeit"></p>
        <input type="radio" name="vorlehrzeit" value="vorlehrzeit_ja" />
        <label for="vorlehrzeit_ja" data-i18n="vorlehrzeit_ja"></label><br />
        <input type="radio" name="vorlehrzeit" value="vorlehrzeit_nein" />
        <label for="vorlehrzeit_nein" data-i18n="no"></label><br />
      </div>
      <br />
      <div>
        <p data-i18n="berufschule">Berufschule</p>
        <input type="radio" name="berufschule" value="berufschule_laufend" />
        <label for="berufschule_laufend" data-i18n="berufschule_laufend">laufend</label><br />
        <input type="radio" name="berufschule" value="berufschule_nein" />
        <label for="berufschule_nein" data-i18n="no">Nein</label><br />
      </div>
      <br />
      <div>
        <p data-i18n="gender"></p>
        <input type="radio" id="male" name="gender" value="male" />
        <label for="male" data-i18n="male">Männlich</label><br />
        <input type="radio" id="female" name="gender" value="female" />
        <label for="female" data-i18n="female">Weiblich</label><br />
        <input type="radio" id="diverse" name="gender" value="diverse" />
        <label for="diverse" data-i18n="diverse">Divers</label><br />
      </div>
      <br />
      <div class="sameLine">
        <div>
          <label data-i18n="firstname">Vorname:</label><br />
          <input required type="text" placeholder="Max" id="firstName" name="firstName" pattern="[A-Za-z]+"
            data-i18n-placeholder="firstname_ph" />
        </div>
        <div>
          <label data-i18n="lastname">Nachname:</label><br />
          <input required type="text" placeholder="Mustermann" id="lastName" name="lastName" pattern="[A-Za-z]+"
            data-i18n-placeholder="lastname_ph" />
        </div>
      </div>
      <div>
        <label data-i18n="scnr">SVNr.</label><br />
        <input required type="text" placeholder="1234 567890" id="scnr" name="scnr" pattern="[0-9]{10}" />
        <p data-i18n="scnr_text" id="svnrMessage" style="color: rgb(7, 229, 7); display: none" name="svnrMessage">
          SVNr ist korrekt!
        </p>
      </div>
      <div>
        <label data-i18n="birthday">Geburtstag</label><br />
        <input required type="text" id="birthday" name="birthday" data-i18n-placeholder="birthday_ph" />
      </div>
      <div>
        <label data-i18n="birth_country">Geburtsland</label><br />
        <input required type="text" placeholder="Österreich" id="birthCountry" name="birthCountry" pattern="[A-Za-z]+"
          data-i18n-placeholder="birth_country_ph" />
      </div>
      <div>
        <label data-i18n="birth_city">Geburtsort</label><br />
        <input required type="text" placeholder="Wien" id="birthCity" name="birthCity" pattern="[A-Za-z]+"
          data-i18n-placeholder="birth_city_ph" />
      </div>
      <div>
        <label data-i18n="street">Straße</label><br />
        <input required type="text" placeholder="Hauptstraße" id="street" name="street" pattern="[A-Za-z]+"
          data-i18n-placeholder="street_ph" />
      </div>
      <div class="sameLine">
        <div>
          <label data-i18n="house_number">Hausnummer</label>
          <input placeholder="4" type="text" id="houseNumber" name="houseNumber" pattern="[A-Za-z0-9]+" />
        </div>
        <div>
          <label data-i18n="staircase">Stiege</label>
          <input placeholder="3" type="text" id="staircase" name="staircase" pattern="[A-Za-z0-9]+" />
        </div>
        <div>
          <label data-i18n="door">Tür</label>
          <input placeholder="15" type="text" id="door" name="door" pattern="[A-Za-z0-9]+" />
        </div>
      </div>
      <div class="sameLine">
        <div>
          <label data-i18n="zip">PLZ</label><br />
          <input required type="text" placeholder="1234" id="zip" name="zip" data-i18n-placeholder="zip_ph"
            pattern="[0-9]{3,5}" />
        </div>
        <div>
          <label data-i18n="city">Ort</label><br />
          <input required type="text" placeholder="Wien" id="city" name="city" data-i18n-placeholder="city_ph"
            pattern="[A-Za-z]+" />
        </div>
      </div>
      <div>
        <label data-i18n="phone">Telefonnummer:</label><br />
        <input required type="tel" placeholder="+43 1234567890" id="phone" name="phone" pattern="\+?[0-9\s\-]+"
          data-i18n-placeholder="phone_ph" />
      </div>
      <div>
        <label data-i18n="email">E-Mail:</label><br />
        <input required type="email" placeholder="beispiel@domain.com" id="email" name="email"
          pattern="^[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[A-Za-z]{2,}$" data-i18n-placeholder="email_ph" />
      </div>
      <div class="contactBox">
        <label data-i18n="contact"><b></b></label>

        <div>
          <br />
          <label data-i18n="advicer">Betruer_In etc.</label>
          <input type="text" placeholder="Erika Musterfrau" name="kontakt_betreuer" pattern="[A-Za-z]+"
            data-i18n-placeholder="betreuer_ph" />
        </div>
        <div class="KontaktJugendlich">
          <div>
            <p data-i18n="guardian">Erziehungsberechtiger</p>
            <input type="radio" name="kontakt" value="father" />
            <label for="father" data-i18n="father">Vater</label><br />
            <input type="radio" name="kontakt" value="mother" />
            <label for="mother" data-i18n="mother">Mutter</label><br />
            <input type="radio" name="kontakt" value="other" />
            <label for="other" data-i18n="other">sonstiges</label><br />
          </div>
        </div>
        <div class="sameLine">
          <div>
            <label data-i18n="firstname">Vorname</label>
            <input required type="text" placeholder="Max" name="kontakt_vorname" data-i18n-placeholder="vorname_ph"
              pattern="[A-Za-z]+" />
          </div>
          <div>
            <label data-i18n="lastname">Nachname</label>
            <input required type="text" placeholder="Mustermann" name="kontakt_nachname" pattern="[A-Za-z]+"
              data-i18n-placeholder="nachname_ph" />
          </div>
        </div>
        <div>
          <label data-i18n="street">Straße</label>
          <input required type="text" placeholder="Hauptstraße" name="kontakt_straße" pattern="[A-Za-z]+"
            data-i18n-placeholder="straße_ph" />
        </div>
        <div class="sameLine">
          <div>
            <label data-i18n="house_number">Hausnr.</label>
            <input required type="text" placeholder="6" name="kontakt_houseNumber" pattern="[A-Za-z0-9]+"
              data-i18n-placeholder="houseNumber_ph" />
          </div>
          <div>
            <label data-i18n="staircase">Stiege</label>
            <input required type="text" placeholder="6" name="kontakt_straircase" pattern="[A-Za-z0-9]+"
              data-i18n-placeholder="staircase_ph" />
          </div>
          <div>
            <label data-i18n="door">Tür</label>
            <input required type="text" placeholder="13" name="kontakt_door" data-i18n-placeholder="door_ph"
              pattern="[A-Za-z0-9]+" />
          </div>
        </div>
        <div class="sameLine">
          <div>
            <label data-i18n="zip">PLZ</label>
            <input required type="text" placeholder="1234" name="kontakt_plz" data-i18n-placeholder="zip_ph"
              pattern="[0-9]{3,5}" />
          </div>
          <div>
            <label data-i18n="city">Ort</label>
            <input required type="text" placeholder="Wien" name="kontakt_ort" data-i18n-placeholder="city_ph"
              pattern="[A-Za-z]+" />
          </div>
        </div>
        <div class="sameLine">
          <div>
            <label data-i18n="phone">Telefonnummer:</label><br />
            <input required type="tel" placeholder="+43 1234567890" id="kontakt_phone" name="kontakt_phone"
              pattern="\+?[0-9\s\-]+" data-i18n-placeholder="phone_ph" />
          </div>
        </div>
      </div>
      <br />
      <div>
        <label for="letzteSchulform" data-i18n="last_school">
          Zuletzt besuchte Schule:
        </label>
        <select name="letzteSchulform" id="letzteSchulform">
          <option value="MS/NMS/FMS">MS/NMS/FMS</option>
          <option value="PTS">PTS</option>
          <option value="AHS">AHS</option>
          <option value="BHS">BHS</option>
          <option value="BS">BS</option>
          <option value="Pflichtschule" data-i18n="school_compulsory">
            Pflichtschule
          </option>
        </select>
      </div>
      <br />
      <div>
        <label data-i18n="note">Ihre Notize:</label><br />
        <textarea rows="4" cols="50" class="noteText" type="textarea"
          placeholder="Hier können Sie Ihre Notizen eingeben." id="textarea" name="notize"
          pattern="^[A-Za-z0-9\s.,!?'-]{0,250}$" data-i18n-placeholder="note_ph"></textarea>
      </div>
      <div>
        <label data-i18n="registration_form">Meldezettel (JPEG/JPG, PNG oder PDF)</label><br />
        <input required type="file" id="meldezettel" name="meldezettel" />
      </div>
      <div>
        <label data-i18n="birth_cert">Geburtsurkunde (JPEG/JPG, PNG oder PDF)</label><br />
        <input required type="file" id="birthCert" name="birthCert" />
      </div>
      <div>
        <label data-i18n="citizenship">Staatsbürgerschaftsnachweis (JPEG/JPG, PNG oder PDF)</label><br />
        <input required type="file" id="citizenship" name="citizenship" />
      </div>
      <div>
        <label data-i18n="bank_card">Kontokarte (JPEG/JPG, PNG oder PDF)</label><br />
        <input required type="file" id="bankCard" name="bankCard" />
      </div>
      <div>
        <label data-i18n="ecard">E-Card (JPEG/JPG, PNG oder PDF)</label><br />
        <input required type="file" id="ecard" name="ecard" />
      </div>
      <div>
        <label data-i18n="residence">Aufenthaltstitel (JPEG/JPG, PNG oder PDF)</label><br />
        <input required type="file" id="residence" name="residence" />
      </div>
      <button class="btn-liquid liquid" type="submit" data-i18n="submit">
        Absenden
      </button>
      <a href="../index.html">
        <button class="btn-liquid liquid" type="button" data-i18n="back">
          Zurück
        </button>
      </a>
    </form>
    <br />
    <br />
    <script src="../i18n.js"></script>
  </div>
  <script src="../validierung.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
  <script>
    flatpickr("#birthday", {
      dateFormat: "d-m-Y",
      maxDate: new Date().setFullYear(new Date().getFullYear() - 14),
    });
  </script>
  <script>
    const birthdayInput = document.getElementById("birthday");
    const kontaktDiv = document.querySelector(".KontaktJugendlich");
    birthdayInput.addEventListener("change", function () {
      const birthday = new Date(this.value.split("-").reverse().join("-"));
      const today = new Date();
      let age = today.getFullYear() - birthday.getFullYear();
      const monthDiff = today.getMonth() - birthday.getMonth();
      if (
        monthDiff < 0 ||
        (monthDiff === 0 && today.getDate() < birthday.getDate())
      ) {
        age--;
      }
      if (age <= 18) {
        kontaktDiv.style.display = "block";
      } else {
        kontaktDiv.style.display = "none";
      }
    });
  </script>
</body>

</html>
