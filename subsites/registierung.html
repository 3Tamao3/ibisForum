<!doctype html>
<html lang="de">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ibis acam - Registrierung</title>
  <link rel="stylesheet" href="../style.css" />
  <link rel="icon" type="image/png" href="../imgs/images.png" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css" />
</head>

<body>
  <div class="centerBox">
    <div class="topRow">
      <img src="../imgs/images.png" alt="ibis acam Logo" />
      <div class="spracheButtons">
        <button type="button" class="btn-liquid liquid" id="btnDE">DE</button>
        <button type="button" class="btn-liquid liquid" id="btnEN">EN</button>
      </div>
    </div>
    <h1 data-i18n="registration_title"></h1>
    <form action="../connect.php" method="post" enctype="multipart/form-data">
      <div class="sameLine">
        <div>
          <label data-i18n="lastname"></label><br />
          <input required type="text" id="lastName" name="lastName" pattern="[A-Za-z]+"
            data-i18n-placeholder="lastname_ph" /><br />
        </div>
        <div>
          <label data-i18n="firstname"></label><br />
          <input required type="text" id="firstName" name="firstName" pattern="[A-Za-z]+"
            data-i18n-placeholder="firstname_ph" /><br />
        </div>
      </div>
      <div>
        <label data-i18n="scnr"></label><br />
        <input required type="text" id="scnr" name="scnr" pattern="[0-9]{10}" data-i18n-placeholder="scnr_ph" /><br />
      </div>
      <p data-i18n="scnr_text" id="svnrMessage" style="color: rgb(7, 173, 7); display: none">
        SVNr ist korrekt!
      </p>
      <div>
        <label>
          <span data-i18n="provider"></span>
          <span class="info-icon" data-i18n-title="provider_info" title="" aria-label="Info">
            🛈
          </span> </label><br />

        <select required class="providerDropdown" name="provider" data-i18n-placeholder="provider_ph">
          <option value="" disabled selected>Bitte auswählen</option>
          <option value="Sprungbrett">Sprungbrett</option>
          <option value="ABO_Jugend">ABO Jugend</option>
          <option value="BFI">BFI</option>
          <option value="AMS">AMS</option>
          <option value="AMS">Sonstige</option>
        </select>
        <br><br>
        <div class="providerElse">
          <input required type="text" id="provider" name="provider"
            data-i18n-placeholder="provider_ph" /><br />
        </div>
      </div>

      <div>
        <p data-i18n="career_check_question"></p>
        <input type="radio" id="career_yes" name="career" value="yes" />
        <label for="career_yes" data-i18n="yes"></label><br />
        <input type="radio" id="career_no" name="career" value="no" />
        <label for="career_no" data-i18n="no"></label><br />
      </div>
      <br />
      <div id="careerExtraFields" style="display: none">
        <div>
          <label data-i18n="phone"></label><br />
          <input required type="tel" id="phone" name="phone" pattern="\+?[0-9\s\-]+"
            data-i18n-placeholder="phone_ph" /><br />
        </div>
        <div>
          <label data-i18n="email"></label><br />
          <input required type="email" id="email" name="email" data-i18n-placeholder="email_ph"
            pattern="^[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[A-Za-z]{2,}$" /><br />
        </div>
        <div>
          <label for="appointment" data-i18n="appointments"></label>
          <input required type="text" id="appointment" name="appointment" placeholder="DD-MM-YYYY" />
        </div>
      </div>
      <button type="submit" class="btn-liquid liquid" data-i18n="submit"></button>
      <a href="../index.html">
        <button type="button" class="btn-liquid liquid" data-i18n="back"></button>
      </a>
    </form>
  </div>
  <script src="../i18n.js"></script>
  <script>
    const careerYes = document.getElementById("career_yes");
    const careerNo = document.getElementById("career_no");
    const extraFields = document.getElementById("careerExtraFields");

    const extraInputs = extraFields.querySelectorAll(
      "input, select, textarea",
    );

    function setExtraFieldsEnabled(enabled) {
      extraFields.style.display = enabled ? "block" : "none";

      extraInputs.forEach((el) => {
        el.disabled = !enabled;

        if (el.id === "phone" || el.id === "email") {
          el.required = enabled;
        }

        if (!enabled) {
          el.value = "";
        }
      });
    }

    function updateCareerFields() {
      const shouldShow = careerYes && careerYes.checked;
      setExtraFieldsEnabled(shouldShow);
    }

    updateCareerFields();

    if (careerYes) careerYes.addEventListener("change", updateCareerFields);
    if (careerNo) careerNo.addEventListener("change", updateCareerFields);
  </script>

  <script src="../validierung.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
  <script>
    flatpickr("#appointment", {
      allowInput: true,
      dateFormat: "d-m-Y",
      minDate: "today",
      maxDate: new Date().fp_incr(30),
      disable: [
        "today",
        function (date) {
          return date.getDay() !== 1;
        },
      ],
    });
  </script>
</body>

</html>
