<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title data-i18n="page_title_checkin"></title>
  <link rel="stylesheet" href="../style.css" />
  <link rel="icon" type="image/png" href="../imgs/img_ibis_logo.png" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css" />
</head>

<body>
  <div class="classCenterBox">
    <div class="classTopRow">
      <img src="../imgs/img_ibis_logo.png" alt="ibis acam Logo" />
      <div class="classLanguageButtons">
        <button class="class-btn-liquid liquid" type="button" id="btnDE">DE</button>
        <button class="class-btn-liquid liquid" type="button" id="btnEN">EN</button>
      </div>
    </div>
    <h1 data-i18n="checkin_title"></h1>
    <form action="../connect.php" method="post" enctype="multipart/form-data">
      <div>
        <label data-i18n="admin_note"> </label>
      </div>
      <br />
      <div>
        <label for="teachingFormID" data-i18n="choose_teaching_form"> </label>
        <br />
        <select required name="teachingForm" id="teachingFormID">
          <option value="" disabled selected data-i18n="choose"></option>
          <option value="UEBN1">ÜBN1</option>
          <option value="UEBN2">ÜBN2</option>
          <option value="UEBV">ÜBV</option>
          <option value="TQU2">TQU2</option>
        </select>
      </div>
      <br />
      <div>
        <label for="apprenticeship" data-i18n="choose_apprenticeship"> </label>
        <br />
        <select required name="apprenticeship" id="apprenticeshipID">
          <option value="" disabled selected data-i18n="choose"></option>
          <option value="applikationsentwickler - coding" data-i18n="job_appdev">
          <option value="buerokaufleute" data-i18n="job_office">
          <option value="drogisten" data-i18n="job_drugstore">
          <option value="einzelhandel" data-i18n="job_retail">
          <option value="betriebslogistik" data-i18n="job_logistics">
          <option value="immobilienkaufleute" data-i18n="job_realestate">
          <option value="informationstechnologie - betriebstechnik" data-i18n="job_it_ops">
          <option value="speitinskaufleute" data-i18n="job_forwarding">
          <option value="kosmetik" data-i18n="job_cosmetics">Kosmetik</option>
          <option value="pka" data-i18n="job_pka">
        </select>
      </div>
      <br />
      <div>
        <p data-i18n="pre_apprenticeship_period"></p>
        <input required type="radio" id="preApprenticeshipYes" name="preApprenticeshipPeriod" value="yes" />
        <label for="preApprenticeshipYes" data-i18n="pre_apprenticeship_period_yes"></label><br />
        <input required type="radio" id="preApprenticeshipNo" name="preApprenticeshipPeriod" value="no" />
        <label for="preApprenticeshipNo" data-i18n="no"></label><br />
      </div>
      <br />
      <div>
        <p data-i18n="vocational_school"></p>
        <input required type="radio" id="vocationalSchoolOngoing" name="vocationalSchool" value="ongoing" />
        <label for="vocationalSchoolOngoing" data-i18n="vocational_school_ongoing"></label><br />
        <input required type="radio" id="vocationalSchoolNo" name="vocationalSchool" value="no" />
        <label for="vocationalSchoolNo" data-i18n="no"></label><br />
      </div>
      <br />
      <div>
        <p data-i18n="gender"></p>
        <input required type="radio" id="genderMale" name="gender" value="male" />
        <label for="genderMale" data-i18n="male"></label><br />
        <input required type="radio" id="genderFemale" name="gender" value="female" />
        <label for="genderFemale" data-i18n="female"></label><br />
        <input required type="radio" id="genderDiverse" name="gender" value="diverse" />
        <label for="genderDiverse" data-i18n="diverse"></label><br />
      </div>
      <br />
      <div class="classSameLine">
        <div>
          <label data-i18n="firstname"></label><br />
          <input required type="text" placeholder="Max" id="firstName" name="firstName" pattern="[A-Za-z]+"
            data-i18n-placeholder="firstname_ph" />
        </div>
        <div>
          <label data-i18n="lastname"></label><br />
          <input required type="text" placeholder="Mustermann" id="lastName" name="lastName" pattern="[A-Za-z]+"
            data-i18n-placeholder="lastname_ph" />
        </div>
      </div>
      <div>
        <label data-i18n="familyStatus"></label><br />
        <select required class="classProviderDropdown" name="provider" data-i18n-placeholder="provider_ph">
          <option value="" disabled selected data-i18n="choose"></option>
          <option value="Sprungbrett">Ledig</option>
          <option value="ABO_Jugend">ABO Verheiratet</option>
          <option value="BFI">Geschieden</option>
          <option value="AMS">verwitwet</option>
        </select>
      </div>
      <br>
      <div>
        <label data-i18n="social_security_number">SVNr.</label><br />
        <input required type="text" placeholder="1234 567890" id="socialSecurityNumber" name="socialSecurityNumber"
          pattern="[0-9]{10}" />
        <p data-i18n="social_security_number_text" id="socialSecurityNumberMessage"
          style="color: rgb(7, 229, 7); display: none" name="socialSecurityNumberMessage">
          SVNr ist korrekt!
        </p>
      </div>
      <div>
        <label data-i18n="birthday">Geburtstag</label><br />
        <input required type="text" id="birthday" name="birthday" data-i18n-placeholder="birthday_ph" />
      </div>
      <div>
        <label data-i18n="birth_country">Geburtsland</label><br />
        <input required type="text" placeholder="Österreich" id="birthCountry" name="birthCountry" pattern="[A-Za-z]+"
          data-i18n-placeholder="birth_country_ph" />
      </div>
      <div>
        <label data-i18n="birth_city">Geburtsort</label><br />
        <input required type="text" placeholder="Wien" id="birthCity" name="birthCity" pattern="[A-Za-z]+"
          data-i18n-placeholder="birth_city_ph" />
      </div>
      <div class="classContactBox">
        <div>
          <label data-i18n="street">Straße</label><br />
          <input required type="text" placeholder="Hauptstraße" id="street" name="street" pattern="[A-Za-z]+"
            data-i18n-placeholder="street_ph" />
        </div>
        <div class="classSameLine">
          <div>
            <label data-i18n="house_number">Hausnummer</label>
            <input required placeholder="4" type="text" id="houseNumber" name="houseNumber" pattern="[A-Za-z0-9]+" />
          </div>
          <div>
            <label data-i18n="staircase">Stiege</label>
            <input required placeholder="3" type="text" id="staircase" name="staircase" pattern="[A-Za-z0-9]+" />
          </div>
          <div>
            <label data-i18n="door">Tür</label>
            <input required placeholder="15" type="text" id="door" name="door" pattern="[A-Za-z0-9]+" />
          </div>
        </div>
        <div class="classSameLine">
          <div>
            <label data-i18n="zip">PLZ</label><br />
            <input required type="text" placeholder="1234" id="zip" name="zip" data-i18n-placeholder="zip_ph"
              pattern="[0-9]{3,5}" />
          </div>
          <div>
            <label data-i18n="city">Ort</label><br />
            <input required type="text" placeholder="Wien" id="city" name="city" data-i18n-placeholder="city_ph"
              pattern="[A-Za-z]+" />
          </div>
        </div>
      </div>
      <br>
      <div>
        <label data-i18n="phone">Telefonnummer:</label><br />
        <input required type="tel" placeholder="+43 1234567890" id="phone" name="phone" pattern="\+?[0-9\s\-]+"
          data-i18n-placeholder="phone_ph" />
      </div>
      <div>
        <label data-i18n="email">E-Mail:</label><br />
        <input required type="email" placeholder="beispiel@domain.com" id="email" name="email"
          pattern="^[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[A-Za-z]{2,}$" data-i18n-placeholder="email_ph" />
      </div>
      <div class="classContactBox">
        <label data-i18n="contact"><b></b></label>

        <div>
          <br />
          <label data-i18n="advicer">Betruer_In etc.</label>
          <input type="text" placeholder="Erika Musterfrau" name="contactAdvicer" pattern="[A-Za-z]+"
            data-i18n-placeholder="advicer_ph" />
        </div>
        <div class="classContactYouth">
          <div>
            <p data-i18n="guardian">Erziehungsberechtiger</p>
            <input type="radio" name="contact" value="father" />
            <label for="father" data-i18n="father">Vater</label><br />
            <input type="radio" name="contact" value="mother" />
            <label for="mother" data-i18n="mother">Mutter</label><br />
            <input type="radio" name="contact" value="other" />
            <label for="other" data-i18n="other">sonstiges</label><br />
          </div>
        </div>
        <div class="classSameLine">
          <div>
            <label data-i18n="firstname">Vorname</label>
            <input required type="text" placeholder="Max" name="contactFirstName" data-i18n-placeholder="firstName_ph"
              pattern="[A-Za-z]+" />
          </div>
          <div>
            <label data-i18n="lastname">Nachname</label>
            <input required type="text" placeholder="Mustermann" name="contactLastName" pattern="[A-Za-z]+"
              data-i18n-placeholder="lastName_ph" />
          </div>
        </div>
        <div>
          <label data-i18n="street">Straße</label>
          <input required type="text" placeholder="Hauptstraße" name="contactStreet" pattern="[A-Za-z]+"
            data-i18n-placeholder="street_ph" />
        </div>
        <div class="classSameLine">
          <div>
            <label data-i18n="house_number">Hausnr.</label>
            <input required type="text" placeholder="6" name="contactHouseNumber" pattern="[A-Za-z0-9]+"
              data-i18n-placeholder="houseNumber_ph" />
          </div>
          <div>
            <label data-i18n="staircase">Stiege</label>
            <input required type="text" placeholder="6" name="contactStraircase" pattern="[A-Za-z0-9]+"
              data-i18n-placeholder="staircase_ph" />
          </div>
          <div>
            <label data-i18n="door">Tür</label>
            <input required type="text" placeholder="13" name="contactdoor" data-i18n-placeholder="door_ph"
              pattern="[A-Za-z0-9]+" />
          </div>
        </div>
        <div class="classSameLine">
          <div>
            <label data-i18n="zip">PLZ</label>
            <input required type="text" placeholder="1234" name="contactZIP" data-i18n-placeholder="zip_ph"
              pattern="[0-9]{3,5}" />
          </div>
          <div>
            <label data-i18n="city">Ort</label>
            <input required type="text" placeholder="Wien" name="contactCity" data-i18n-placeholder="city_ph"
              pattern="[A-Za-z]+" />
          </div>
        </div>
        <div class="classSameLine">
          <div>
            <label data-i18n="phone">Telefonnummer:</label><br />
            <input required type="tel" placeholder="+43 1234567890" id="contactPhone" name="contactPhone"
              pattern="\+?[0-9\s\-]+" data-i18n-placeholder="phone_ph" />
          </div>
        </div>
      </div>
      <br />
      <div>
        <label for="lastSchoolForm" data-i18n="last_school">
          Zuletzt besuchte Schule:
        </label>
        <select name="lastSchoolForm" id="lastSchoolForm">
          <option value="" disabled selected data-i18n="choose">Bitte auswählen</option>
          <option value="MS/NMS/FMS">MS/NMS/FMS</option>
          <option value="PTS">PTS</option>
          <option value="AHS">AHS</option>
          <option value="BHS">BHS</option>
          <option value="BS">BS</option>
          <option value="Pflichtschule" data-i18n="school_compulsory">
        </select>
      </div>
      <br />
      <div>
        <label data-i18n="note"></label><br />
        <textarea rows="4" cols="50" class="classNoteText" type="textarea"
          placeholder="Hier können Sie Ihre Notizen eingeben." id="textarea" name="note"
          pattern="^[A-Za-z0-9\s.,!?'-]{0,250}$" data-i18n-placeholder="note_ph"></textarea>
      </div>
      <div>
        <label data-i18n="registration_form"></label><br />
        <input required type="file" id="registrationForm" name="registrationForm" />
      </div>
      <div>
        <label data-i18n="birth_cert"></label><br />
        <input required type="file" id="birthCert" name="birthCert" />
      </div>
      <div>
        <label data-i18n="citizenship"></label><br />
        <input required type="file" id="citizenship" name="citizenship" />
      </div>
      <div>
        <label data-i18n="bank_card"></label><br />
        <input required type="file" id="bankCard" name="bankCard" />
      </div>
      <div>
        <label data-i18n="ecard"></label><br />
        <input required type="file" id="ecard" name="ecard" />
      </div>
      <div>
        <label data-i18n="residence"></label><br />
        <input type="file" id="residence" name="residence" />
      </div>
      <button class="class-btn-liquid liquid" type="submit" data-i18n="submit">
        Absenden
      </button>
      <a href="../index.html">
        <button class="class-btn-liquid liquid" type="button" data-i18n="back">
          Zurück
        </button>
      </a>
    </form>
    <br />
    <br />
    <script src="../i18n.js"></script>
  </div>
  <script src="../validation.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
  <script>
    flatpickr("#birthday", {
      allowInput: true,
      dateFormat: "d-m-Y",
      maxDate: new Date().setFullYear(new Date().getFullYear() - 14),
    });
  </script>
  <script>
    const birthdayInput = document.getElementById("birthday");
    const kontaktDiv = document.querySelector(".classContactYouth");
    birthdayInput.addEventListener("change", function () {
      const birthday = new Date(this.value.split("-").reverse().join("-"));
      const today = new Date();
      let age = today.getFullYear() - birthday.getFullYear();
      const monthDiff = today.getMonth() - birthday.getMonth();
      if (
        monthDiff < 0 ||
        (monthDiff === 0 && today.getDate() < birthday.getDate())
      ) {
        age--;
      }
      if (age <= 18) {
        kontaktDiv.style.display = "block";
      } else {
        kontaktDiv.style.display = "none";
      }
    });
  </script>
</body>

</html>
